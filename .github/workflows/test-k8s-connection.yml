name: Test Kubernetes Connection (OIDC)

on:
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: myapp-eks-cluster

# This block is mandatory to request the OIDC JWT token from GitHub
permissions:
  id-token: write
  contents: read

jobs:
  test-k8s:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/YourGitHubActionsRole # Replace with your IAM Role ARN
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Test cluster connection
        run: |
          kubectl cluster-info
          kubectl get nodes
          kubectl get pods -A
