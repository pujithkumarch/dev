name: Test Kubernetes Connection

on:
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: myapp-eks-cluster
  ECR_REPOSITORY: myapp_docker_repo

jobs:
  test-k8s:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          web-identity-token-file: "" 

      # LOG IN TO ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # AUTOMATICALLY FIND AND BUILD DOCKERFILE
      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          DOCKERFILE_PATH=$(find . -name Dockerfile -exec dirname {} \;)
          if [ -z "$DOCKERFILE_PATH" ]; then
            echo "❌ ERROR: Still could not find a file named Dockerfile anywhere in the repository!"
            exit 1
          fi
          echo "Found Dockerfile in folder: $DOCKERFILE_PATH"
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG "$DOCKERFILE_PATH"
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "Image pushed successfully!"

      # INSTALL KUBECTL AND AUTHENTICATOR
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Install AWS IAM Authenticator
        run: |
          curl -o aws-iam-authenticator https://s3.us-west-2.amazonaws.com/amazon-eks/1.21.2/2021-07-05/bin/linux/amd64/aws-iam-authenticator
          chmod +x ./aws-iam-authenticator
          sudo mv ./aws-iam-authenticator /usr/local/bin/

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Test cluster connection
        run: |
          kubectl cluster-info
          kubectl get nodes
          kubectl get pods -A

      # PUSH TEST POD TO RUN YOUR DOCKER IMAGE
      - name: Run test pod with new image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl run test-web-app --image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG --restart=Never || true
