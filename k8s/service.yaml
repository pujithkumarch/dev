apiVersion: v1
kind: Service
metadata:
  name: myapp-service
  annotations:
    # This tells AWS to make it a public, internet-facing load balancer
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  selector:
    app: myapp
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer
